name: Sumele acordurilor (notele Guvernului)

# Citește, de pe gov.md, ordinea de zi a fiecărei ședințe de Guvern și, pentru
# punctele despre acorduri de asistență externă, nota de argumentare (PDF), unde
# ministerul scrie suma acordului. Rezultatul: date/gov_sume.json, pe care pagina
# Acorduri îl citește la deschidere (coloana „Suma", cu semnul G).
#
# Ședința de Guvern are loc înainte ca hotărârea să apară în Monitorul Oficial,
# deci un acord nou găsit de monitor are deja suma.
#
# Prima rulare citește istoricul ședințelor (cât încape în 45 de minute); rulările
# următoare continuă istoricul, apoi citesc doar ședințele noi.
# Pornire manuală: Actions → „Sumele acordurilor (notele Guvernului)" → Run workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * 1-5"      # 07:45 UTC, luni–vineri

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  sume:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Pregătește Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalează bibliotecile
        run: pip install --quiet requests beautifulsoup4 pypdf

      - name: Citește notele Guvernului de pe gov.md
        run: |
          set +e
          python gov_sume.py --limita-min 45
          cod=$?
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d = json.load(open('date/gov_sume.json', encoding='utf-8'))
          except Exception:
              d = {}
          p = d.get('puncte', {})
          cu = sum(1 for x in p.values() if x.get('sume') and not x.get('modificare'))
          print('### Sumele acordurilor din notele Guvernului')
          print(f"- ședințe citite: **{len(d.get('sedinte', {}))}** · istoric complet: {'da' if d.get('istoric_complet') else 'încă nu'}")
          print(f'- puncte despre acorduri: **{len(p)}** · cu sumă (fără modificări): **{cu}**')
          PY
          if [ "$cod" != "0" ]; then
            echo "- ⚠️ gov.md nu a răspuns la această rulare." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Salvează
        run: |
          if [ -z "$(git status --porcelain date/gov_sume.json)" ]; then
            echo "Nimic nou — nu fac commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add date/gov_sume.json
          git commit -m "Sumele acordurilor din notele Guvernului — $(date +%d.%m.%Y)"
          for incercare in 1 2 3; do
            if git push; then
              echo "Publicat."
              exit 0
            fi
            echo "Push respins (încercarea $incercare) — reîmprospătez și reîncerc."
            git pull --rebase origin main || exit 1
            sleep 3
          done
          echo "Nu am reușit să public după 3 încercări."
          exit 1
