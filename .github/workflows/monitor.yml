name: Verifică Monitorul Oficial

on:
  schedule:
    # 06:00 UTC = 09:00 ora Chișinăului (vara). Luni–vineri.
    # GitHub întârzie frecvent cron-urile cu 1-2 ore. E normal, nu e o eroare.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:        # permite pornirea manuală din interfața GitHub

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@v4
        with:
          # Fixat explicit pe main. Fără asta, un "Re-run jobs" pe o rulare
          # veche face checkout pe commit-ul de ATUNCI: rulează codul vechi și
          # apoi nu poate face push, fiindcă main a avansat între timp.
          ref: main

      - name: Pregătește Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalează bibliotecile
        run: pip install --quiet requests beautifulsoup4

      - name: Rulează colectarea
        run: python monitor_watch.py

      - name: Salvează dacă au apărut acte noi
        run: |
          if [ -z "$(git status --porcelain date.json)" ]; then
            echo "Nimic nou — nu fac commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add date.json
          git commit -m "Acte noi — $(date +%d.%m.%Y)"

          # Dacă main a avansat între checkout și acum (o altă rulare, un fișier
          # urcat manual), push-ul simplu e respins și tot job-ul pică degeaba.
          # Rebazăm peste starea curentă și reîncercăm de câteva ori.
          for incercare in 1 2 3; do
            if git push; then
              echo "Publicat."
              exit 0
            fi
            echo "Push respins (încercarea $incercare) — reîmprospătez și reîncerc."
            git pull --rebase origin main || exit 1
            sleep 3
          done
          echo "Nu am reușit să public după 3 încercări."
          exit 1
