name: Cursul valutar (BCE)

# Paginile trec sumele în euro cu cursurile de referință ale Băncii Centrale Europene.
# Cursurile erau scrise de mână (acorduri.html, „var PER_EUR"), deci rămâneau la data la care
# fuseseră puse. Acum curs_bce.py le citește în fiecare dimineață de la BCE și le scrie în:
#   - acorduri.html și legis_acorduri.html (tabelul PER_EUR și data cursului),
#   - date/acorduri_legare.json (cursurile și echivalentul în euro al sumelor), de unde le ia
#     pagina „Debursări pe acorduri".
# BCE publică cursurile în zilele lucrătoare, după-amiaza; dimineața e deci cursul zilei de ieri
# (luni dimineața: cel de vineri). Sâmbăta și duminica scriptul nu găsește un curs mai nou și nu
# schimbă nimic, la fel în sărbătorile BCE.
#
# Dacă BCE nu răspunde sau trimite cursuri care nu par bune (lipsește o valută, un curs iese cu
# mai mult de 30% din cel de până acum), scriptul nu scrie nimic și rularea apare ca eșuată în
# Actions; cursurile de până atunci rămân.
#
# Pornire manuală: Actions → „Cursul valutar (BCE)" → Run workflow.

on:
  workflow_dispatch:
  schedule:
    # 05:20 UTC = 07:20 (iarna) / 08:20 (vara) ora Chișinăului, în fiecare zi.
    # GitHub întârzie frecvent cron-urile cu până la o oră sau două: e normal, nu e o eroare.
    - cron: "20 5 * * *"

permissions:
  contents: write

# aceeași coadă ca monitor.yml, sume.yml și legaturi.yml: toate scriu în același repository
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  curs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descarcă repository-ul
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Pregătește Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # testele sunt rapide și nu folosesc rețeaua; dacă pică, cursul nu se atinge
      - name: Verifică scriptul
        run: python teste_curs.py

      - name: Citește cursurile BCE și le scrie în pagini
        run: python curs_bce.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Salvează
        run: |
          FISIERE="acorduri.html legis_acorduri.html date/acorduri_legare.json"
          if [ -z "$(git status --porcelain $FISIERE)" ]; then
            echo "Nimic nou — nu fac commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FISIERE
          git commit -m "Cursul valutar BCE — $(date +%d.%m.%Y)"
          for incercare in 1 2 3; do
            if git push; then
              echo "Publicat."
              exit 0
            fi
            echo "Push respins (încercarea $incercare) — reîmprospătez și reîncerc."
            git pull --rebase origin main || exit 1
            sleep 3
          done
          echo "Nu am reușit să public după 3 încercări."
          exit 1
